[package]
name = "sidera"
version = "3.1.0"
edition = "2021"
description = "Sidera - screen annotation overlay (Rust, X11, layer-shell and GNOME Wayland)"
license = "GPL-3.0-only"

[lib]
name = "sidera_core"
path = "src/lib.rs"

[[bin]]
name = "sidera"
path = "src/main.rs"

[dependencies]
tiny-skia = "0.11"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "5"
log = "0.4"
env_logger = "0.11"
serde_json = "1"
sha1 = "0.10"
url = "2"

[target.'cfg(unix)'.dependencies]
x11rb = { version = "0.13", features = ["shape", "xtest", "randr", "xinput"] }
libc = "0.2"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
calloop = "0.13"
calloop-wayland-source = "0.3"
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop"] }
wayland-scanner = "0.31"
wayland-backend = "0.3"
evdev = "0.13.2"
arboard = { version = "3", features = ["wayland-data-control"] }
zbus = "4"
async-io = "2"
futures-lite = "2"

[target.'cfg(windows)'.dependencies]
arboard = "3"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
] }
quick-xml = "0.41"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = true
